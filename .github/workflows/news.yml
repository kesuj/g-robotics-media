name: tech-news-gdai
# Daily "Tech News with G. Dai": deep research + script (Claude Code) → G. Dai voice (OmniVoice clone) → premium
# newsroom render → QA → queue. Publishes at the 18:00 NPT slot (publish.yml). 09:30 UTC = 15:15 NPT.
on:
  schedule:
    - cron: "30 9 * * *"
  workflow_dispatch:

concurrency: {group: state-writer, cancel-in-progress: false}
permissions: {contents: write, id-token: write}

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: ffmpeg (static build; avoids slow apt mirrors)
        timeout-minutes: 10
        uses: FedericoCarboni/setup-ffmpeg@v3
      - run: pip install -r requirements.txt -r requirements-news.txt
      - uses: actions/cache@v4
        with: {path: "~/.cache/huggingface", key: omnivoice-whisper-v1}
      - name: Today's date in Nepal
        id: d
        run: |
          echo "date=$(TZ=Asia/Kathmandu date +%F)" >> "$GITHUB_OUTPUT"
          echo "stamp=$(TZ=Asia/Kathmandu date +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - name: Research and write today's episode (Claude Code)
        if: hashFiles(format('briefs/news/news-{0}.json', steps.d.outputs.stamp)) == ''
        uses: anthropics/claude-code-action@v1
        env: {NEWS_DATE: "${{ steps.d.outputs.date }}"}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "Today's Nepal date is ${{ steps.d.outputs.date }}. Follow docs/prompts/news-editor.md exactly and write briefs/news/news-${{ steps.d.outputs.stamp }}.json."
          claude_args: >-
            --max-turns 120
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash(python:*),Bash(ls:*)"
      - name: Voice, render, QA and queue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OMNIVOICE_PYTHON: python
          WHISPER_MODEL: base.en
          GDAI_STEPS: "16"
        run: python -m gr.produce.run --limit 1
      - name: Save state
        if: always()
        run: |
          git config user.name "g-robotics-bot"; git config user.email "bot@users.noreply.github.com"
          git add briefs state; git commit -m "news: $(date -u +%FT%TZ)" || exit 0
          git pull --rebase && git push
