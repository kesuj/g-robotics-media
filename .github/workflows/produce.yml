name: research-and-produce
# Twice a day: collect research → (if the queue is short) Claude Code writes briefs → render → QA → queue.
# 00:30 UTC = 06:15 NPT (before the first slot) and 10:30 UTC = 16:15 NPT (before the news slot).
on:
  schedule:
    - cron: "30 0 * * *"
    - cron: "30 10 * * *"
  workflow_dispatch:

concurrency: {group: state-writer, cancel-in-progress: false}
permissions: {contents: write, id-token: write}

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: ffmpeg (static build; avoids slow apt mirrors)
        timeout-minutes: 10
        uses: FedericoCarboni/setup-ffmpeg@v3
      - name: System packages
        timeout-minutes: 15
        run: sudo apt-get install -y --no-install-recommends fonts-noto-color-emoji espeak-ng || (sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-color-emoji espeak-ng)
      - run: pip install -r requirements.txt -r requirements-render.txt
      - run: npm install --prefix gr/produce/engine
      - uses: actions/cache@v4
        with: {path: "~/.cache/huggingface", key: kokoro-v1}
      - name: Research
        run: python -m gr.research.collect
      - name: Performance digest for the editor (state/research/performance.md)
        run: python -m gr.analytics.digest
      - name: How many Reels are ready?
        id: backlog
        run: echo "short=$(python -m gr.backlog)" >> "$GITHUB_OUTPUT"
      - name: Write briefs with Claude Code
        if: steps.backlog.outputs.short == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.SS || secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}   # repo token; no Claude GitHub App needed (the editor only edits files)
          show_full_output: true
          prompt: "Follow docs/prompts/editor.md exactly, using the skills in .claude/skills for every Reel."
          claude_args: >-
            --max-turns 160
            --allowedTools "Skill,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash(python:*),Bash(ls:*)"
      - name: Render, QA and queue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python -m gr.produce.run --limit 4
      - name: Save state
        if: always()
        run: |
          git config user.name "g-robotics-bot"; git config user.email "bot@users.noreply.github.com"
          git add briefs state; git commit -m "produce: $(date -u +%FT%TZ)" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
